<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Results | Scent Secrets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="perfume-database.js" defer></script>
    <script src="results.js" defer></script>
</head>
<body class="results-page">
<header class="results-nav">
    <a class="brand" href="Homepage.html#home" aria-label="Go to Scent Secrets home">
        <img src="scent-secrets-logo.svg" alt="" aria-hidden="true">
        <span class="brand-text">
            <span class="brand-name">Scent Secrets</span>
            <span class="brand-tagline">Find your signature spray</span>
        </span>
    </a>
    <nav class="nav-shell">
        <a href="Homepage.html#home" class="nav-link">HOME</a>
        <a href="Homepage.html#tips" class="nav-link">TIPS & GUIDES</a>
        <a href="Homepage.html#types" class="nav-link">PERFUME TYPES</a>
        <a href="Homepage.html#families" class="nav-link">SCENT FAMILIES</a>
        <a href="Homepage.html#about" class="nav-link">ABOUT</a>
    </nav>
    <div class="results-actions">
        <input id="resultsSearch" type="search" placeholder="Search perfume...">
        <button id="searchBtn" type="button">Search</button>
        <button id="openFilters" type="button">Filter</button>
    </div>
</header>

<main class="results-shell">
    <section class="suggestion" id="suggestionBox">
        <p class="hint">Quick Picks</p>
        <p class="hint-sub">Tap one to instantly filter:</p>
        <div class="quick-picks" id="quickPicks">
            <button type="button" class="quick-pick" data-pick="office">Office Ready</button>
            <button type="button" class="quick-pick" data-pick="date">Date Night</button>
            <button type="button" class="quick-pick" data-pick="summer">Summer Fresh</button>
            <button type="button" class="quick-pick" data-pick="party">Party Mode</button>
            <button type="button" class="quick-pick" data-pick="clean">Clean &amp; Minimal</button>
        </div>
    </section>

    <section class="results-grid" id="resultsGrid" aria-live="polite"></section>

</main>

<div class="perfume-modal" id="perfumeModal" aria-hidden="true">
    <div class="perfume-modal-card" role="dialog" aria-modal="true" aria-label="Perfume details">
        <button id="closePerfumeModal" type="button" aria-label="Close perfume details">&times;</button>
        <aside class="details" id="detailPanel">
            <p class="placeholder">Select a perfume to see details.</p>
        </aside>
    </div>
</div>

<div class="filter-modal" id="filterModal" aria-hidden="true">
    <div class="filter-panel">
        <div class="filter-head">
            <h3>Filter Perfumes</h3>
            <button id="closeFilters" type="button" aria-label="Close filter modal">&times;</button>
        </div>
        <div class="filter-group">
            <label for="priceSlider">Price Range: <span id="priceLabel">PHP 30,000</span></label>
            <input id="priceSlider" type="range" min="0" max="30000" step="100" value="30000">
        </div>

        <div class="filter-group families">
            <p>Scent Family</p>
            <label><input type="checkbox" value="Floral"> Floral</label>
            <label><input type="checkbox" value="Fresh"> Fresh</label>
            <label><input type="checkbox" value="Woody"> Woody</label>
            <label><input type="checkbox" value="Oriental"> Oriental</label>
            <label><input type="checkbox" value="Gourmand"> Gourmand</label>
        </div>

        <div class="filter-group types">
            <p>Perfume Type</p>
            <label><input type="checkbox" value="EDT"> EDT</label>
            <label><input type="checkbox" value="EDP"> EDP</label>
            <label><input type="checkbox" value="Parfum"> Parfum</label>
            <label><input type="checkbox" value="Cologne"> Cologne</label>
        </div>

        <div class="filter-group audiences">
            <p>Audience</p>
            <label><input type="checkbox" value="men"> For Men</label>
            <label><input type="checkbox" value="women"> For Women</label>
            <label><input type="checkbox" value="unisex"> Unisex</label>
        </div>

        <div class="filter-actions">
            <button type="button" id="resetFilters">Reset</button>
            <button type="button" id="applyFilters">Apply</button>
        </div>
    </div>
</div>
</body>
</html>
